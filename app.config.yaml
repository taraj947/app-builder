application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      app builder2:
        license: Apache-2.0
        actions:
          generic:
            function: actions/generic/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: false
              final: true
          signup:
            function: actions/signup/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: false
              final: true
          login:
            function: actions/login/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
            annotations:
              require-adobe-auth: false
              final: true
          validate-token:
            function: actions/validate-token/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
            annotations:
              require-adobe-auth: false
              final: true
          ingest-products:
            function: actions/ingest-products/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              DB_REGION: apac
              INGEST_API_KEY: $INGEST_API_KEY
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          get-products:
            function: actions/get-products/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          get-product-details:
            function: actions/get-product-details/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
    database:
      auto-provision: false
      region: apac
